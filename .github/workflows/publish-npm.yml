name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing audited release tag, for example v0.4.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install current trusted-publishing npm client
        run: npm install --global npm@12.0.2

      - name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force --tags origin
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "false"

      - name: Install and verify
        run: |
          npm ci
          npm run check
          npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --access public
