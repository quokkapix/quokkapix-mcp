name: MCP Adapter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Syntax and unit tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Audit runtime dependencies
        run: npm audit --audit-level=moderate

      - name: Verify bridge CLI entry
        run: node src/entry.mjs bridge --help

      - name: Verify npm package contents
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm pack --dry-run

      - name: Build npm package artifact
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm pack

      - name: Upload npm package artifact
        if: runner.os == 'Linux' && matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quokkapix-mcp-${{ github.sha }}
          path: quokkapix-mcp-*.tgz
          if-no-files-found: error
          retention-days: 14
