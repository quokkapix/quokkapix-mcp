name: MCP Adapter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Syntax and unit tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Audit runtime dependencies
        run: npm audit --audit-level=moderate

      - name: Verify bridge CLI entry
        run: node src/entry.mjs bridge --help

      - name: Verify npm package contents
        if: runner.os == 'Linux'
        run: npm pack --dry-run
